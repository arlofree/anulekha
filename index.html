<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Himanshu & Anulekha</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:#0a0a0a;color:white;overflow-x:hidden;}

.gold{
  background:linear-gradient(45deg,#d4af37,#f9e79f);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.hero{
  height:100vh;
  background:linear-gradient(rgba(0,0,0,0.6),rgba(0,0,0,0.8)), url('photo1.jpg') center/cover;
  display:flex;justify-content:center;align-items:center;text-align:center;
}

.hero h1{font-family:'Playfair Display';font-size:60px;}
.section{padding:100px 20px;text-align:center;}

.gallery{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;padding:20px;
}

.gallery img{
  width:100%;border-radius:20px;transition:0.4s;
}
.gallery img:hover{transform:scale(1.05);}

button{
  background:linear-gradient(45deg,#d4af37,#f9e79f);
  color:black;
  padding:12px 30px;
  border:none;
  border-radius:30px;
  font-weight:600;
  cursor:pointer;
}
</style>
</head>

<body>

<section class="hero">
  <div>
    <h1>Himanshu <span class="gold">&</span> Anulekha</h1>
    <p>25 April 2026</p>
  </div>
</section>

<!-- UPLOAD SECTION -->
<section class="section">
  <h2 class="gold">Upload Your Photos</h2>

  <input type="file" id="fileInput" accept="image/*"><br><br>

  <button onclick="uploadImage()">Upload Photo 📸</button>
</section>

<!-- LIVE GALLERY -->
<section class="section">
  <h2 class="gold">Live Guest Memories</h2>
  <div id="gallery" class="gallery"></div>
</section>

<script>
const cloudName = "dmboosevq";

// LOAD GALLERY
function loadGallery(){
  fetch(`https://res.cloudinary.com/${cloudName}/image/list/wedding.json`)
  .then(res=>res.json())
  .then(data=>{
    const gallery=document.getElementById("gallery");
    gallery.innerHTML="";
    data.resources.forEach(img=>{
      const image=document.createElement("img");
      image.src=img.secure_url;
      gallery.appendChild(image);
    });
  });
}

// UPLOAD FUNCTION (NO GOOGLE FORM ANYWHERE)
function uploadImage(){
  const file=document.getElementById("fileInput").files[0];

  if(!file){
    alert("Select image first");
    return;
  }

  const formData=new FormData();
  formData.append("file",file);
  formData.append("upload_preset","wedding_upload");

  fetch(`https://api.cloudinary.com/v1_1/${cloudName}/image/upload`,{
    method:"POST",
    body:formData
  })
  .then(res=>res.json())
  .then(data=>{
    alert("Uploaded ❤️");

    // instantly add image
    const gallery=document.getElementById("gallery");
    const image=document.createElement("img");
    image.src=data.secure_url;
    gallery.prepend(image);

    document.getElementById("fileInput").value="";
  });
}

// LOAD ON START
loadGallery();
</script>

</body>
</html>
